name: Awesome action
description: Wraps the slack notification action

inputs:
  payload:
    description: Direct JSON string payload to send
    required: false
    default: ''
  payload-file-path:
    description: Path to the template with the payload to send
    required: false
    default: ''
  replacements:
    description: Replacements to perform on the payload file
    required: false
    default: ''
  channel-id:
    description: Channel to send the notification to
    required: true
  slack-bot-token:
    description: Access token to the Slack API
    required: true
  thread-ts:
    description: The timestamp of a parent message to reply to
    required: false
    default: ''
  reply-broadcast:
    description: When replying to a thread, also send the message to the main channel
    required: false
    default: 'false'

outputs:
  message-ts:
    description: The timestamp (ts) of the message that was sent
    value: ${{ steps.send-message.outputs.message-ts }}

runs:
  using: "composite"
  steps:
    - id: send-message
      run: |
        set -e
        if [[ -n "$INPUT_PAYLOAD_FILE_PATH" ]]; then
          echo "Using payload from file: $INPUT_PAYLOAD_FILE_PATH"
          if [[ ! -f "$INPUT_PAYLOAD_FILE_PATH" ]]; then
            echo "Error: Payload file not found at $INPUT_PAYLOAD_FILE_PATH"
            exit 1
          fi
          PAYLOAD_CONTENT=$(cat "$INPUT_PAYLOAD_FILE_PATH")

          if [[ -n "$INPUT_REPLACEMENTS" ]]; then
            OLD_IFS=$IFS
            IFS=$'\n,'
            for replacement in $INPUT_REPLACEMENTS; do
              KEY=$(echo "$replacement" | cut -d'=' -f1)
              VALUE=$(echo "$replacement" | cut -d'=' -f2-)
              echo "Replacing placeholder '{$KEY}' with '$VALUE'"
              PAYLOAD_CONTENT=$(echo "$PAYLOAD_CONTENT" | sed "s|{$KEY}|$VALUE|g")
            done
            IFS=$OLD_IFS
          fi
        elif [[ -n "$INPUT_PAYLOAD" ]]; then
          echo "Using direct payload input."
          PAYLOAD_CONTENT="$INPUT_PAYLOAD"
        else
          echo "Error: You must provide either 'payload' or 'payload-file-path'."
          exit 1
        fi

        FINAL_PAYLOAD=$(jq -c --arg ch_id "$INPUT_CHANNEL_ID" '.channel = $ch_id' <<< "$PAYLOAD_CONTENT")

        if [[ -n "$INPUT_THREAD_TS" ]]; then
          echo "Replying in thread: $INPUT_THREAD_TS"
          FINAL_PAYLOAD=$(jq -c --arg th_ts "$INPUT_THREAD_TS" '.thread_ts = $th_ts' <<< "$FINAL_PAYLOAD")

          if [[ "$INPUT_REPLY_BROADCAST" == "true" ]]; then
            echo "Broadcasting reply to channel."
            FINAL_PAYLOAD=$(jq -c '.reply_broadcast = true' <<< "$FINAL_PAYLOAD")
          fi
        fi

        echo "Final payload being sent to Slack:"
        echo "$FINAL_PAYLOAD" | jq .

        API_RESPONSE=$(curl -s -X POST "https://slack.com/api/chat.postMessage" \
          -H "Authorization: Bearer $INPUT_SLACK_BOT_TOKEN" \
          -H "Content-Type: application/json; charset=utf-8" \
          -d "$FINAL_PAYLOAD")

        echo "Slack API Response: $API_RESPONSE"

        if [[ $(jq -r '.ok' <<< "$API_RESPONSE") != "true" ]]; then
          ERROR_MSG=$(jq -r '.error' <<< "$API_RESPONSE")
          echo "::error title=Slack API Error::$ERROR_MSG"
          exit 1
        fi

        MESSAGE_TS=$(jq -r '.ts' <<< "$API_RESPONSE")
        echo "Successfully sent message with ts: $MESSAGE_TS"
        echo "message-ts=$MESSAGE_TS" >> "$GITHUB_OUTPUT"
      shell: bash
      env:
        INPUT_PAYLOAD: ${{ inputs.payload }}
        INPUT_PAYLOAD_FILE_PATH: ${{ inputs.payload-file-path }}
        INPUT_REPLACEMENTS: ${{ inputs.replacements }}
        INPUT_CHANNEL_ID: ${{ inputs.channel-id }}
        INPUT_SLACK_BOT_TOKEN: ${{ inputs.slack-bot-token }}
        INPUT_THREAD_TS: ${{ inputs.thread-ts }}
        INPUT_REPLY_BROADCAST: ${{ inputs.reply-broadcast }}
